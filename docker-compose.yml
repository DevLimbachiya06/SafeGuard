services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - safeguard_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - safeguard_redis:/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mobile-preview:
    build:
      context: ./mobile-preview
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  safeguard_pgdata:
  safeguard_redis: